name: Build GLASS TV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP (if present)
        shell: bash
        run: |
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -gt 0 ]; then
            mkdir -p extracted
            for z in "${zips[@]}"; do
              unzip -oq "$z" -d extracted
            done
            # Copy the project root (the folder containing settings.gradle) into the repository root.
            settings_file=$(find extracted -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit)
            if [ -n "$settings_file" ]; then
              project_dir=$(dirname "$settings_file")
              cp -a "$project_dir"/. .
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-22" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android project
        run: |
          test -f settings.gradle -o -f settings.gradle.kts || { echo "settings.gradle is missing. Check that the ZIP contains the Android project."; exit 1; }
          test -f app/build.gradle -o -f app/build.gradle.kts || { echo "app/build.gradle is missing. The ZIP must contain the complete app folder."; exit 1; }

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Upload GLASS TV APK
        uses: actions/upload-artifact@v4
        with:
          name: GLASS-TV-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
